<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FTIR Dashboard</title>

  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main class="panel">
    <header>
      <div class="eyebrow">Excel FTIR</div>
      <h1>FTIR Dashboard</h1>
      <p class="sub">Interactive Plotly spectra plus optional native Excel charts.</p>
    </header>

    <section class="card">
      <label for="stage">Processing stage</label>
      <select id="stage">
        <option value="Log">Log / pseudo-absorbance</option>
        <option value="Corrected">Baseline corrected</option>
        <option value="Smoothed" selected>Smoothed</option>
        <option value="Normalized">Normalized</option>
      </select>

      <div class="toolbar">
        <button id="selectAll" class="secondary">Select all</button>
        <button id="clearAll" class="secondary">Clear all</button>
      </div>

      <div id="sampleList" class="sample-list"></div>

      <label for="qcSample">QC sample</label>
      <select id="qcSample"></select>

      <label class="check">
        <input type="checkbox" id="autoRefresh" checked />
        Auto-refresh after Python processing
      </label>

      <label class="check">
        <input type="checkbox" id="autoOpen" />
        Open FTIR dashboard automatically with this workbook
      </label>

      <div class="actions">
        <button id="refresh" class="secondary">Reload data</button>
        <button id="native" class="primary">Build native Excel dashboard</button>
      </div>
    </section>

    <section class="card chart-card">
      <div class="chart-title">Spectra</div>
      <div id="mainPlot" class="plot"></div>
    </section>

    <section class="card chart-card">
      <div class="chart-title">Processing QC</div>
      <div id="qcPlot" class="plot"></div>
    </section>

    <div id="status" class="status">Starting…</div>
  </main>

  <script src="taskpane.js"></script>
</body>
</html>
