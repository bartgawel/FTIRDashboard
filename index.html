<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FTIR Dashboard</title>

  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main class="panel">
    <header>
      <div class="eyebrow">Excel FTIR</div>
      <h1>FTIR Dashboard</h1>
      <p class="sub">
        Native Excel spectra charts linked to the xlwings Lite processing workflow.
      </p>
    </header>

    <section class="card">
      <label for="stage">Processing stage</label>
      <select id="stage">
        <option value="Log">Log / pseudo-absorbance</option>
        <option value="Corrected">Baseline corrected</option>
        <option value="Smoothed" selected>Smoothed</option>
        <option value="Normalized">Normalized</option>
      </select>

      <label for="qcSample">QC sample</label>
      <select id="qcSample"></select>

      <label class="check">
        <input type="checkbox" id="showQc" checked />
        Show processing QC chart
      </label>

      <label class="check">
        <input type="checkbox" id="autoRefresh" checked />
        Auto-refresh after Python processing
      </label>

      <div class="actions">
        <button id="reload" class="secondary">Reload samples</button>
        <button id="build" class="primary">Build / refresh dashboard</button>
      </div>
    </section>

    <section class="card small">
      <strong>Workflow</strong>
      <p>
        Replace the data on <b>Raw</b>, run <b>process_ftir</b>, and this task pane
        will rebuild the native Excel dashboard automatically.
      </p>
    </section>

    <div id="status" class="status">Starting…</div>
  </main>

  <script src="taskpane.js"></script>
</body>
</html>
